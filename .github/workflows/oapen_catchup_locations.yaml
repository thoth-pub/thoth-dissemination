# Purpose: write newly-registered OAPEN/DOAB locations to Thoth records.
# Weekly catchup check of OAPEN/DOAB APIs for works not previously listed.
name: oapen-catchup-locations

on:
  schedule:
    # 'at 02:20 every Tuesday'
    # (scheduling is not guaranteed; runs at the start of the hour
    # are more likely to be delayed)
    - cron: '20 2 * * 2'
  workflow_dispatch:
    inputs:
      max_locations:
        description: "Maximum number of locations to write in this run"
        required: false
        default: "250"
        type: number

jobs:
  obtain-locations:
    runs-on: ubuntu-latest
    outputs:
      NEW_LOCATIONS: ${{ steps.get-locations.outputs.NEW_LOCATIONS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements_obtain_new_ids.txt

      - name: Get details of works without locations using Python script
        id: get-ids
        run: |
          output=$(python obtain_new_ids.py --platform OAPEN --locations)
          echo "NEW_IDS=$output" >> $GITHUB_OUTPUT
        env:
          ENV_PUBLISHERS: ${{ vars.OAPEN_ENV_PUBLISHERS }}
          ENV_EXCEPTIONS: ${{ vars.OAPEN_ENV_EXCEPTIONS }}

      - name: Get locations for selected works using Python script
        id: get-locations
        run: |
          raw_output=$(echo "${{ steps.get-ids.outputs.NEW_IDS }}" | python obtain_oapen_locations.py)
          echo "$raw_output" > new_locations.json

          MAX_LOCATIONS="${{ inputs.max_locations }}"
          if [ -z "$MAX_LOCATIONS" ]; then
            MAX_LOCATIONS=250
          fi

          output=$(MAX_LOCATIONS="$MAX_LOCATIONS" python - <<'PY'
          import json
          import os
          import sys

          max_locations_raw = os.environ.get("MAX_LOCATIONS", "250")

          try:
              max_locations = int(max_locations_raw)
          except ValueError:
              print(f"::error::Invalid max_locations value: {max_locations_raw}", file=sys.stderr)
              sys.exit(1)

          if max_locations < 1:
              print("::error::max_locations must be at least 1", file=sys.stderr)
              sys.exit(1)

          if max_locations > 256:
              print(
                  f"::notice::Requested max_locations={max_locations}, but GitHub matrix limit is 256. "
                  "Capping to 256.",
                  file=sys.stderr,
              )
              max_locations = 256

          with open("new_locations.json", "r", encoding="utf-8") as locations_file:
              locations = json.load(locations_file)

          if not isinstance(locations, list):
              print(
                  "::error::Expected obtain_oapen_locations.py to return a JSON array",
                  file=sys.stderr,
              )
              sys.exit(1)

          total = len(locations)
          capped = locations[:max_locations]

          if total > max_locations:
              print(
                  f"::notice::Capping NEW_LOCATIONS from {total} to {max_locations}. "
                  f"{total - max_locations} remaining locations should be picked up by a later rerun.",
                  file=sys.stderr,
              )
          else:
              print(f"::notice::NEW_LOCATIONS contains {total} locations.", file=sys.stderr)

          print(json.dumps(capped, separators=(",", ":")))
          PY
          )

          echo "NEW_LOCATIONS=$output" >> $GITHUB_OUTPUT

  write-locations:
    runs-on: ubuntu-latest
    needs: obtain-locations
    if: needs.obtain-locations.outputs.NEW_LOCATIONS != '[]'
    strategy:
      fail-fast: false
      matrix:
        location: ${{ fromJSON(needs.obtain-locations.outputs.NEW_LOCATIONS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements_write_locations.txt

      - name: Write location to temp file
        run: echo "${{ matrix.location }}" >> location.txt

      - name: Write location to Thoth using Python script
        run: python write_locations.py location.txt
        env:
          THOTH_PAT: ${{ secrets.THOTH_PAT }}
